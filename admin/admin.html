<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>EIS Compass Admin</title>
<style>
:root{--navy:#002e7a;--navy-2:#1d4a9a;--sky:#53c3f0;--orange:#ff9933;--red:#c4291e;--ink:#1a2238;--ink-2:#4b5775;--ink-3:#5f6984;--line:#e3e7ef;--bg:#f4f6fa;--ok:#1f7a3a;--warn:#a94f00;--err:#a3241a;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header{background:var(--navy);color:#fff}
header .in{max-width:1280px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:18px;margin:0}
header h1 small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--sky)}
header .file{margin-left:auto;font-size:13px;color:#cfdaf5}
.stripe{height:4px;background:linear-gradient(90deg,var(--sky) 0 33.3%,var(--orange) 33.3% 66.6%,var(--red) 66.6%)}
nav{background:#fff;border-bottom:1px solid var(--line)}
nav .in{max-width:1280px;margin:0 auto;padding:0 20px;display:flex;gap:4px;overflow-x:auto}
nav button{border:0;background:none;padding:12px 14px 10px;font-weight:650;color:var(--ink-3);border-bottom:3px solid transparent;white-space:nowrap}
nav button[aria-selected=true]{color:var(--navy);border-bottom-color:var(--orange)}
nav .n{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:#fde8e6;color:var(--err);font-size:12px;margin-left:4px}
nav .n.w{background:#fff1e0;color:var(--warn)}
main{max-width:1280px;margin:0 auto;padding:20px}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(16,30,70,.08);padding:18px 20px;margin-bottom:16px}
h2{margin:0 0 6px;font-size:19px}
p.lead{margin:0 0 14px;color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid #cfd6e3;background:#fff;border-radius:8px;padding:8px 13px;font-weight:650;color:var(--navy);text-decoration:none}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.danger{color:var(--err);border-color:#efc1bc}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.drop{border:2px dashed #b8c3d8;border-radius:12px;padding:28px;text-align:center;color:var(--ink-2);background:#fafbfe}
.drop.over{border-color:var(--orange);background:#fff8ef}
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.steps li{counter-increment:s;background:var(--bg);border-radius:10px;padding:12px 14px 12px 46px;position:relative;font-size:14px}
.steps li::before{content:counter(s);position:absolute;left:12px;top:12px;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;text-align:center;line-height:24px;font-size:13px}
.steps b{display:block}
table{width:100%;border-collapse:collapse;font-size:14px}
th{position:sticky;top:0;background:#f7f9fc;text-align:left;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);padding:8px;border-bottom:1px solid var(--line);z-index:1}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover{background:#f8faff}
td .ja{display:block;color:var(--ink-3);font-size:13px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:#eef1f6;color:var(--ink-2);margin:1px 2px 1px 0;white-space:nowrap}
.pill.err{background:#fde8e6;color:var(--err)}
.pill.warn{background:#fff1e0;color:var(--warn)}
.pill.ok{background:#e6f6ec;color:var(--ok)}
.tablewrap{max-height:70vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search],.toolbar select{border:1px solid #cfd6e3;border-radius:8px;padding:7px 10px;background:#fff}
.issues li{margin:6px 0}
.issues a{cursor:pointer;color:var(--navy-2);text-decoration:underline}
dialog{border:0;border-radius:14px;padding:0;width:min(860px,calc(100% - 24px));box-shadow:0 20px 60px rgba(0,20,60,.3)}
dialog::backdrop{background:rgba(10,22,52,.5)}
.dh{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.dh h3{margin:0;font-size:17px;margin-right:auto}
.db{padding:16px 20px;max-height:70vh;overflow:auto}
.df{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:#fafbfd;position:sticky;bottom:0}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:650;color:var(--ink-2)}
.form label.full{grid-column:1/-1}
.form input[type=text],.form input[type=date],.form textarea,.form select{border:1px solid #cfd6e3;border-radius:8px;padding:7px 9px;font-weight:400;color:var(--ink);background:#fff}
.form textarea{min-height:88px;resize:vertical}
.form .checks{display:flex;flex-wrap:wrap;gap:6px 14px;font-weight:400}
.form .checks label{flex-direction:row;align-items:center;font-weight:400;color:var(--ink)}
.form small{font-weight:400;color:var(--ink-3)}
.diff h4{margin:14px 0 6px}
.diff ul{margin:0;padding-left:20px}
.diff .old{color:var(--err);text-decoration:line-through}
.diff .new{color:var(--ok)}
textarea.code{width:100%;min-height:55vh;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid #cfd6e3;border-radius:8px;padding:10px}
.stat{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0}
.stat div{background:var(--bg);border-radius:10px;padding:10px 14px;min-width:120px}
.stat b{display:block;font-size:22px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><div class="in"><h1><small>Private · not for publishing</small>EIS Compass Admin</h1><span class="file" id="fileinfo">No calendar loaded</span></div></header>
<div class="stripe"></div>
<nav><div class="in" role="tablist">
  <button data-tab="start" aria-selected="true">1 · Open</button>
  <button data-tab="events">2 · Events <span id="n-events" class="pill"></span></button>
  <button data-tab="closures">Holidays &amp; terms</button>
  <button data-tab="text">Page text</button>
  <button data-tab="check">3 · Check <span id="n-check"></span></button>
  <button data-tab="publish">4 · Publish</button>
</div></nav>
<main id="main"></main>

<dialog id="dlg"><div id="dlg-in"></div></dialog>
<div class="toast" id="toast"></div>
<input type="file" id="f-html" accept=".html,.htm" hidden>
<input type="file" id="f-sheet" accept=".xlsx,.csv,.tsv,.txt" hidden>

<script>
(function () {
'use strict';
/* =========================================================
   State
   ========================================================= */
var DATA = null, TEMPLATE = null, FILENAME = '', TAB = 'start', FILTER = { q: '', month: '' };
var EV_COLS = ['id', 'start', 'end', 'time', 'audiences', 'parents_invited', 'no_classes', 'status', 'title_en', 'title_ja', 'description_en', 'description_ja', 'location_en', 'location_ja', 'image', 'hidden'];
var CL_COLS = ['start', 'end', 'type', 'name_en', 'name_ja'];
var STATUSES = { '': 'Confirmed', tentative: 'To be confirmed', changed: 'Date changed', cancelled: 'Cancelled' };
var CL_TYPES = { national: 'National holiday (no school)', school: 'School holiday (no school)', noclass: 'No classes (e.g. staff prep day)' };

function $(s, r) { return (r || document).querySelector(s); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function isoOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function D(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function addDays(s, n) { var d = D(s); d.setDate(d.getDate() + n); return isoOf(d); }
function validISO(s) { return /^\d{4}-\d{2}-\d{2}$/.test(s || '') && isoOf(D(s)) === s; }
function today() { return isoOf(new Date()); }
function slug(s, n) { return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, n || 48); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function audMap() { var m = {}; DATA.audiences.forEach(function (a) { m[a.id] = a; }); return m; }
var toastT;
function toast(m) { var t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('show'); }, 2600); }

function saveDraft() { try { localStorage.setItem('eisc-admin', JSON.stringify({ data: DATA, template: TEMPLATE, file: FILENAME })); } catch (e) {} }
function loadDraft() { try { var d = JSON.parse(localStorage.getItem('eisc-admin') || 'null'); if (d && d.data && d.template) { DATA = d.data; TEMPLATE = d.template; FILENAME = d.file || 'EISCompass.html'; DATA.events.forEach(normEvent); return true; } } catch (e) {} return false; }
function changed() { saveDraft(); updateCounts(); }

/* =========================================================
   Loading the published page (it is its own template)
   ========================================================= */
var DATA_RE = /(<script type="application\/json" id="compass-data">)([\s\S]*?)(<\/script>)/;
function loadTemplate(text, name) {
  var m = DATA_RE.exec(text);
  if (!m) throw new Error('This file does not look like an EIS Compass page (no compass-data block found).');
  var d = JSON.parse(m[2].replace(/<\\\//g, '</'));
  if (!d.events) throw new Error('The compass-data block has no events.');
  DATA = d; TEMPLATE = text; FILENAME = name || 'EISCompass.html';
  DATA.events.forEach(function (e) { normEvent(e); });
  changed();
}
function normEvent(e) {
  e.title = e.title || { en: '', ja: '' }; e.desc = e.desc || { en: '', ja: '' }; e.location = e.location || { en: '', ja: '' };
  e.aud = e.aud || []; e.end = e.end || e.start; e.time = e.time || ''; e.status = e.status || ''; e.image = e.image || '';
  return e;
}
function readFile(file, cb) {
  var r = new FileReader();
  r.onload = function () { cb(r.result); };
  if (/\.xlsx$/i.test(file.name)) r.readAsArrayBuffer(file); else r.readAsText(file, 'utf-8');
}

/* =========================================================
   Validation
   ========================================================= */
function validate() {
  var out = [], A = audMap(), ids = {}, descs = {}, titles = {};
  var off = (DATA.closures || []);
  DATA.events.forEach(function (e, idx) {
    var add = function (level, msg) { out.push({ level: level, msg: msg, idx: idx, e: e }); };
    if (!validISO(e.start)) add('err', 'Start date is missing or invalid (' + (e.start || 'empty') + ')');
    if (!validISO(e.end)) add('err', 'End date is invalid (' + (e.end || 'empty') + ')');
    else if (e.end < e.start) add('err', 'Ends before it starts');
    if (!e.title.en.trim()) add('err', 'English title is missing');
    if (!e.title.ja.trim()) add('warn', 'Japanese title is missing');
    if (e.desc.en.trim() && !e.desc.ja.trim()) add('warn', 'Japanese description is missing');
    if (!e.desc.en.trim()) add('info', 'No description');
    if (!e.aud.length) add('err', 'No audience selected');
    e.aud.forEach(function (a) { if (!A[a]) add('err', 'Unknown audience "' + a + '"'); });
    if (ids[e.id]) add('err', 'Duplicate ID (same as another event): ' + e.id); ids[e.id] = 1;
    if (e.time && !/^\d{1,2}:\d{2}(\s*[-–~〜]\s*\d{1,2}:\d{2})?$/.test(e.time.trim())) add('warn', 'Time should look like 15:00 or 15:00-17:00');
    if (e.status === 'changed' && !e.prevStart) add('info', 'Marked "Date changed" but no previous date recorded');
    var d = e.desc.en.trim();
    if (d) { (descs[d] = descs[d] || []).push(e); }
    (titles[e.title.en.trim()] = titles[e.title.en.trim()] || []).push(e);
    if (validISO(e.start)) off.forEach(function (c) { if (c.type !== 'noclass' && c.start <= e.start && c.end >= e.start && !e.hidden) add('info', 'Falls on a no-school day: ' + c.name.en); });
  });
  Object.keys(descs).forEach(function (d) {
    var list = descs[d], names = {}; list.forEach(function (e) { names[baseTitle(e.title.en)] = 1; });
    if (Object.keys(names).length > 1) list.forEach(function (e) {
      out.push({ level: 'warn', msg: 'Same description as: ' + list.filter(function (x) { return x !== e; }).map(function (x) { return x.title.en; }).join(', ') + ' — is that intended?', idx: DATA.events.indexOf(e), e: e });
    });
  });
  Object.keys(titles).forEach(function (t) {
    var list = titles[t], ds = {}; list.forEach(function (e) { ds[e.desc.en.trim()] = 1; });
    if (list.length > 1 && Object.keys(ds).length > 1) list.forEach(function (e) {
      out.push({ level: 'info', msg: '"' + t + '" appears ' + list.length + ' times with different descriptions', idx: DATA.events.indexOf(e), e: e });
    });
  });
  (DATA.closures || []).forEach(function (c, i) {
    if (!validISO(c.start) || !validISO(c.end) || c.end < c.start) out.push({ level: 'err', msg: 'Holiday "' + c.name.en + '" has invalid dates', closure: i });
    if (!c.name.ja) out.push({ level: 'warn', msg: 'Holiday "' + c.name.en + '" has no Japanese name', closure: i });
  });
  return out;
}
function baseTitle(t) { return t.replace(/\s*#\d+$/, '').replace(/\s*\d{4}$/, '').trim(); }
function updateCounts() {
  if (!DATA) return;
  var v = validate(), e = v.filter(function (x) { return x.level === 'err'; }).length, w = v.filter(function (x) { return x.level === 'warn'; }).length;
  $('#n-check').innerHTML = e ? '<span class="n">' + e + '</span>' : w ? '<span class="n w">' + w + '</span>' : '';
  $('#n-events').textContent = DATA.events.length;
  $('#fileinfo').textContent = FILENAME + ' · ' + DATA.events.length + ' events · last published ' + (DATA.meta.updated || '?');
}

/* =========================================================
   Views
   ========================================================= */
function show(tab) {
  TAB = tab;
  document.querySelectorAll('nav button').forEach(function (b) { b.setAttribute('aria-selected', String(b.dataset.tab === tab)); });
  var m = $('#main');
  if (!DATA && tab !== 'start') { tab = 'start'; }
  m.innerHTML = ({ start: vStart, events: vEvents, closures: vClosures, text: vText, check: vCheck, publish: vPublish })[tab]();
  if (tab === 'events') bindEventsView();
  if (tab === 'start') bindDrop();
}
function vStart() {
  return '<div class="card"><h2>How this works</h2><p class="lead">This admin page lives on your computer — never upload it to the website. The public page <b>EISCompass.html</b> carries its own data, so this tool opens it, lets you change events, and saves a new copy for you to upload.</p>' +
    '<ol class="steps"><li><b>Open</b>the current EISCompass.html (download it from the website or use your saved copy).</li><li><b>Update events</b>by importing your spreadsheet, or edit single events here.</li><li><b>Check</b>for missing Japanese, wrong dates and duplicates.</li><li><b>Publish</b>— download the new page and calendar feeds and upload them.</li></ol></div>' +
    '<div class="card"><div class="drop" id="drop"><p><b>Drop EISCompass.html here</b> or</p><button class="btn primary" id="pick-html">Choose file…</button>' +
    (DATA ? '<p style="margin-top:14px">Currently open: <b>' + esc(FILENAME) + '</b> (' + DATA.events.length + ' events, unsaved changes are kept in this browser). <button class="btn danger" id="discard">Discard local changes</button></p>' : '') + '</div></div>';
}
function bindDrop() {
  var dz = $('#drop');
  ['dragenter', 'dragover'].forEach(function (t) { dz.addEventListener(t, function (e) { e.preventDefault(); dz.classList.add('over'); }); });
  ['dragleave', 'drop'].forEach(function (t) { dz.addEventListener(t, function (e) { e.preventDefault(); dz.classList.remove('over'); }); });
  dz.addEventListener('drop', function (e) { var f = e.dataTransfer.files[0]; if (f) openHtml(f); });
  $('#pick-html').onclick = function () { $('#f-html').click(); };
  var dc = $('#discard'); if (dc) dc.onclick = function () { if (confirm('Discard all unsaved changes in this browser?')) { localStorage.removeItem('eisc-admin'); DATA = null; TEMPLATE = null; show('start'); $('#fileinfo').textContent = 'No calendar loaded'; } };
}
function openHtml(f) {
  readFile(f, function (text) {
    try { loadTemplate(text, f.name); toast('Opened ' + f.name); show('events'); } catch (err) { alert(err.message); }
  });
}
$('#f-html').addEventListener('change', function () { if (this.files[0]) openHtml(this.files[0]); this.value = ''; });

function issuesFor(idx, all) { return all.filter(function (x) { return x.idx === idx; }); }
function vEvents() {
  var months = {}; DATA.events.forEach(function (e) { if (e.start) months[e.start.slice(0, 7)] = 1; });
  return '<div class="card"><div class="toolbar"><input type="search" id="ev-q" placeholder="Search title or description" value="' + esc(FILTER.q) + '">' +
    '<select id="ev-m"><option value="">All months</option>' + Object.keys(months).sort().map(function (m) { return '<option' + (FILTER.month === m ? ' selected' : '') + '>' + m + '</option>'; }).join('') + '</select>' +
    '<span style="flex:1"></span><button class="btn" id="imp">Import spreadsheet…</button><button class="btn" id="exp-x">Download as Excel</button><button class="btn primary" id="add">+ Add event</button></div>' +
    '<div class="tablewrap"><table><thead><tr><th style="width:110px">Date</th><th>Title</th><th style="width:170px">Audience</th><th style="width:150px">Flags</th><th style="width:170px">Check</th></tr></thead><tbody id="ev-body"></tbody></table></div></div>';
}
function bindEventsView() {
  $('#ev-q').oninput = function () { FILTER.q = this.value; fillEvents(); };
  $('#ev-m').onchange = function () { FILTER.month = this.value; fillEvents(); };
  $('#add').onclick = function () { editEvent(-1); };
  $('#imp').onclick = function () { $('#f-sheet').click(); };
  $('#exp-x').onclick = function () { download('EIS-Compass-events.xlsx', writeXlsx(), 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'); };
  fillEvents();
}
function fillEvents() {
  var A = audMap(), v = validate(), q = FILTER.q.toLowerCase();
  var rows = DATA.events.map(function (e, i) { return { e: e, i: i }; })
    .filter(function (r) { return (!FILTER.month || (r.e.start || '').indexOf(FILTER.month) === 0) && (!q || (r.e.title.en + ' ' + r.e.title.ja + ' ' + r.e.desc.en).toLowerCase().indexOf(q) >= 0); })
    .sort(function (a, b) { return (a.e.start || '') < (b.e.start || '') ? -1 : 1; });
  $('#ev-body').innerHTML = rows.map(function (r) {
    var e = r.e, iss = issuesFor(r.i, v);
    var flags = (e.parents ? '<span class="pill">Parents</span>' : '') + (e.noClasses ? '<span class="pill">No classes</span>' : '') + (e.status ? '<span class="pill warn">' + STATUSES[e.status] + '</span>' : '') +
      (e.hidden ? '<span class="pill err">Hidden</span>' : '') + (e.image ? '<span class="pill">Photo</span>' : '') + (e.time ? '<span class="pill">' + esc(e.time) + '</span>' : '');
    var chk = iss.filter(function (x) { return x.level !== 'info'; });
    return '<tr data-i="' + r.i + '"><td>' + esc(e.start) + (e.end && e.end !== e.start ? '<span class="ja">→ ' + esc(e.end) + '</span>' : '') + '</td>' +
      '<td><b>' + esc(e.title.en) + '</b><span class="ja" lang="ja">' + esc(e.title.ja) + '</span></td>' +
      '<td>' + e.aud.map(function (a) { return '<span class="pill"><span class="dot" style="background:' + (A[a] ? A[a].color : '#999') + '"></span>' + esc(A[a] ? A[a].name.en : a) + '</span>'; }).join('') + '</td>' +
      '<td>' + flags + '</td><td>' + (chk.length ? chk.map(function (x) { return '<span class="pill ' + x.level + '" title="' + esc(x.msg) + '">' + esc(x.msg.length > 28 ? x.msg.slice(0, 26) + '…' : x.msg) + '</span>'; }).join('') : '<span class="pill ok">OK</span>') + '</td></tr>';
  }).join('') || '<tr><td colspan="5">No events match.</td></tr>';
  document.querySelectorAll('#ev-body tr[data-i]').forEach(function (tr) { tr.onclick = function () { editEvent(+tr.dataset.i); }; });
}

function field(label, name, val, opts) {
  opts = opts || {};
  var input = opts.area ? '<textarea name="' + name + '"' + (opts.lang ? ' lang="' + opts.lang + '"' : '') + '>' + esc(val) + '</textarea>'
    : '<input type="' + (opts.type || 'text') + '" name="' + name + '" value="' + esc(val) + '"' + (opts.lang ? ' lang="' + opts.lang + '"' : '') + (opts.ph ? ' placeholder="' + esc(opts.ph) + '"' : '') + (opts.ro ? ' readonly' : '') + '>';
  return '<label class="' + (opts.full ? 'full' : '') + '">' + label + input + (opts.help ? '<small>' + opts.help + '</small>' : '') + '</label>';
}
function editEvent(i) {
  var isNew = i < 0, e = isNew ? normEvent({ id: '', start: '', end: '', aud: [], parents: false, title: { en: '', ja: '' }, desc: { en: '', ja: '' } }) : clone(DATA.events[i]);
  var v = isNew ? [] : issuesFor(i, validate());
  var A = DATA.audiences;
  $('#dlg-in').innerHTML = '<form method="dialog" id="evf"><div class="dh"><h3>' + (isNew ? 'New event' : 'Edit event') + '</h3><button type="button" class="btn" data-x>Close</button></div><div class="db">' +

    else if (c === '"') q = true;
    else if (c === delim) { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += c;

function buildOutputs(d, tpl) {
  var out = clone(d);
  out.events.forEach(function (e) { ['title', 'desc', 'location'].forEach(function (k) { if (e[k] && !e[k].en && !e[k].ja) delete e[k]; }); if (!e.time) delete e.time; if (!e.status) delete e.status; if (!e.image) delete e.image; if (!e.updated) delete e.updated; });
  out.events.sort(function (a, b) { return a.start < b.start ? -1 : a.start > b.start ? 1 : 0; });
  var json = JSON.stringify(out).replace(/<\//g, '<\\/');
  var html = tpl.replace(DATA_RE, function (_, a, b, c) { return a + json + c; })
    .replace(/<!--META:START-->[\s\S]*?<!--META:END-->/, function () { return '<!--META:START-->' + metaHTML(d) + '<!--META:END-->'; })
    .replace(/<!--STATIC:START-->[\s\S]*?<!--STATIC:END-->/, function () { return '<!--STATIC:START-->' + staticHTML(d) + '<!--STATIC:END-->'; });
  return { html: html, feeds: buildFeeds(d) };
}

/* =========================================================
   Boot (and headless build mode used to produce the first release)
   ========================================================= */
var P = new URLSearchParams(location.search);
if (P.get('build')) {
  Promise.all([fetch(P.get('tpl')).then(function (r) { return r.text(); }), fetch(P.get('seed')).then(function (r) { return r.json(); })]).then(function (res) {
    var tpl = res[0].replace(DATA_RE, function (_, a, b, c) { return a + JSON.stringify(res[1]).replace(/<\//g, '<\\/') + c; });
    loadTemplate(tpl, 'EISCompass.html');
    var out = buildOutputs(DATA, TEMPLATE), box = document.createElement('div');
    var put = function (path, text) { var t = document.createElement('textarea'); t.setAttribute('data-out', path); t.textContent = text; box.appendChild(t); };
    put('EISCompass.html', out.html);
    out.feeds.forEach(function (f) { put(f.path, f.text); });
    put('_validation.json', JSON.stringify(validate().map(function (x) { return { level: x.level, msg: x.msg, event: x.e && x.e.title.en, start: x.e && x.e.start }; }), null, 1));
    return writeXlsx().arrayBuffer().then(function (b) {
      var s = '', u8 = new Uint8Array(b); for (var i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
      put('EIS-Compass-events.xlsx.b64', btoa(s));
      return readXlsx(b).then(function (sheets) { put('_xlsx_roundtrip.json', JSON.stringify({ events: sheets.events.length, holidays: sheets.holidays.length, sample: sheets.events[1] })); });
    }).then(function () { document.body.appendChild(box); document.title = 'BUILD-DONE'; });
  }).catch(function (err) { document.title = 'BUILD-FAILED ' + err.message; });
} else {
  if (loadDraft()) updateCounts();
  show(DATA ? 'events' : 'start');
}
})();
</script>
